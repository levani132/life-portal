# Screen tests: the built web app and API against a throwaway Mongo, at a phone's size. Every
# test saves a phone screenshot; they are kept as an artifact for review (and for the daily check).
# Needs no secrets: the database is dropped before every run and nothing leaves the runner.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NX_NO_CLOUD: 'true'
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017
      NEXT_PUBLIC_API_URL: http://localhost:3333/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-screenshots
          path: |
            e2e/screenshots/
            e2e/report/
            e2e/results/
          retention-days: 14
