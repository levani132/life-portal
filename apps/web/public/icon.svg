<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Life Portal">
  <!--
    The mark: a portal ring that doubles as a progress gauge, with three rising bars inside it.
    Two shapes, two colours, no text — so it still reads at 32px on a home screen. The ring is
    deliberately open at the bottom right: this dashboard tracks things that are not finished yet.
  -->
  <rect width="512" height="512" rx="112" fill="#0C0E14"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#1E2430" stroke-width="34"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38BDF8" stroke-width="34"
          stroke-linecap="round" stroke-dasharray="707 943" transform="rotate(-215 256 256)"/>
  <g fill="#34D399">
    <rect x="188" y="286" width="34" height="62" rx="14"/>
    <rect x="239" y="248" width="34" height="100" rx="14"/>
    <rect x="290" y="200" width="34" height="148" rx="14"/>
  </g>
</svg>
